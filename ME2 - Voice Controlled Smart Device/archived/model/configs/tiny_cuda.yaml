# Tiny VCM — default training config (RPi4/5-realtime target).
# Total params ~1.3M; int8 export ~0.7 MB. Well under the 10 MB budget.
n_mels: 40
channels: 128
blocks: 4
device: cuda            # set to 'cuda' if available
epochs: 30
batch_size: 32
lr: 0.001
weight_decay: 0.0001
eval_every: 1

# "Tiny" hard targets (see PLAN.md):
#   weights (int8)  <= 10 MB
#   RAM             <= 250 MB
#   RTF on RPi4     <= 0.5
#   p50 latency     <= 500 ms
# This config's float32 model is ~5 MB; int8 ~1.3 MB.
